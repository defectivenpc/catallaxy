[book]
title = "Catallaxy"
description = "Declarative Kubernetes platform built on NixOS modules"
authors = ["Catallaxy Contributors"]
language = "en"
src = "src"

# A `SUMMARY.md` entry with no file is an error, not an empty page mdbook
# writes for you. The default is the other way round, which means a typo in a
# path renders a blank chapter and passes CI.
[build]
create-missing = false

[output.html]
default-theme = "navy"
git-repository-url = "https://github.com/onepunchtech/catallaxy"
edit-url-template = "https://github.com/onepunchtech/catallaxy/edit/master/docs/book/{path}"

[output.html.search]
enable = true
