[book]
title = "Catallaxy"
description = "Declarative Kubernetes platform built on NixOS modules"
authors = ["Catallaxy Contributors"]
language = "en"
src = "src"

# A SUMMARY entry with no file is an error, not a blank page.
[build]
create-missing = false

[output.html]
default-theme = "navy"
git-repository-url = "https://github.com/onepunchtech/catallaxy"
edit-url-template = "https://github.com/onepunchtech/catallaxy/edit/master/docs/book/{path}"

[output.html.search]
enable = true
